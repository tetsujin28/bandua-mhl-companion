[package]
name = "bandua-mhl-companion"
version = "0.1.0"
edition = "2021"
authors = ["Domingo Olmo Martin"]
license = "MIT"
description = "Contrôle de l'intégrité des rushes à partir de leurs MHL"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
companion-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
